<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img" aria-labelledby="title desc">
  <title id="title">MZS practical systems</title>
  <desc id="desc">A field notebook and systems console inspired banner with a mushroom, topographic contours and network traces.</desc>
  <style>
