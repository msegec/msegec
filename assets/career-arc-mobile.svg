<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" aria-labelledby="title desc">
  <title id="title">Fifteen years from repair to dependable software</title>
  <desc id="desc">A field notebook timeline connecting repair, integration, field operations and software building.</desc>
  <style>
    .bg { fill: #f5f2e8; }
    .grid, .border { stroke: #cbd5c9; }
    .ink { fill: #18231c; }
    .muted { fill: #5f6e63; }
    .pine { fill: #245a3a; }
    .route { stroke: #4f8a4c; }
    .node { fill: #f5f2e8; stroke: #4f8a4c; }
    .active { fill: #4f8a4c; }
    .contour { stroke: #245a3a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1511; }
      .grid, .border { stroke: #34483b; }
      .ink { fill: #edf3ed; }
      .muted { fill: #a6b3a8; }
      .pine { fill: #58be78; }
      .route { stroke: #77b96b; }
      .node { fill: #0d1511; stroke: #77b96b; }
      .active { fill: #a2d477; }
      .contour { stroke: #58be78; }
    }
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" class="grid" stroke-width="1" opacity="0.32"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="358" height="428" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect class="bg" width="360" height="430"/>
    <rect width="360" height="430" fill="url(#grid)" opacity="0.45"/>
    <g class="contour" fill="none" stroke-width="1.2" opacity="0.12">
      <path d="M214 13c88 45 94 102 39 156s-48 116 28 173 73 91 30 124"/>
      <path d="M239 1c89 45 95 106 39 161s-46 111 26 166 77 101 32 137"/>
    </g>
    <path class="route" d="M72 104c-31 53-31 94 0 139s31 83 0 133" fill="none" stroke-width="3" stroke-linecap="round"/>
    <g stroke-width="3">
      <circle class="node" cx="72" cy="104" r="10"/>
      <circle class="node" cx="72" cy="194" r="10"/>
      <circle class="node" cx="72" cy="284" r="10"/>
      <circle class="active" cx="72" cy="376" r="11"/>
    </g>
    <g class="pine" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.5">
      <text x="24" y="38">15+ YEARS / ONE THREAD</text>
      <text x="42" y="409">NOW</text>
    </g>
    <g class="ink" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">
      <text x="110" y="100">REPAIR</text>
      <text x="110" y="190">INTEGRATE</text>
      <text x="110" y="280">OPERATE</text>
      <text x="110" y="372">BUILD</text>
    </g>
    <g class="muted" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">
      <text x="110" y="120">devices / data</text>
      <text x="110" y="210">systems / people</text>
      <text x="110" y="300">field / spatial</text>
      <text x="110" y="392">software / ownership</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="358.5" height="428.5" rx="16" fill="none" class="border" stroke-width="1.5"/>
</svg>
