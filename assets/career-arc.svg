<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230" role="img" aria-labelledby="title desc">
  <title id="title">Fifteen years from repair to dependable software</title>
  <desc id="desc">A field notebook timeline connecting repair, integration, field operations and software building.</desc>
  <style>
    .bg { fill: #f5f2e8; }
    .grid, .border { stroke: #cbd5c9; }
    .ink { fill: #18231c; }
    .muted { fill: #5f6e63; }
    .pine { fill: #245a3a; }
    .route { stroke: #4f8a4c; }
    .node { fill: #f5f2e8; stroke: #4f8a4c; }
    .active { fill: #4f8a4c; }
    .contour { stroke: #245a3a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1511; }
      .grid, .border { stroke: #34483b; }
      .ink { fill: #edf3ed; }
      .muted { fill: #a6b3a8; }
      .pine { fill: #58be78; }
      .route { stroke: #77b96b; }
      .node { fill: #0d1511; stroke: #77b96b; }
      .active { fill: #a2d477; }
      .contour { stroke: #58be78; }
    }
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" class="grid" stroke-width="1" opacity="0.32"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="918" height="228" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect class="bg" width="920" height="230"/>
    <rect width="920" height="230" fill="url(#grid)" opacity="0.45"/>
    <g class="contour" fill="none" stroke-width="1.2" opacity="0.12">
      <path d="M-20 188c121-61 210-55 304-3s189 55 279 3 186-57 377-6"/>
      <path d="M-20 207c121-61 210-55 304-3s189 55 279 3 186-57 377-6"/>
    </g>
    <path class="route" d="M105 128C192 80 250 80 330 128s142 48 225 0 145-48 260 0" fill="none" stroke-width="3" stroke-linecap="round"/>
    <g stroke-width="3">
      <circle class="node" cx="105" cy="128" r="10"/>
      <circle class="node" cx="330" cy="128" r="10"/>
      <circle class="node" cx="555" cy="128" r="10"/>
      <circle class="active" cx="815" cy="128" r="11"/>
    </g>
    <g class="pine" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.7">
      <text x="42" y="42">15+ YEARS / ONE THREAD</text>
      <text x="779" y="42">NOW</text>
    </g>
    <g class="ink" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">
      <text x="70" y="92">REPAIR</text>
      <text x="278" y="178">INTEGRATE</text>
      <text x="516" y="92">OPERATE</text>
      <text x="783" y="178">BUILD</text>
    </g>
    <g class="muted" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">
      <text x="46" y="110">devices / data</text>
      <text x="269" y="197">systems / people</text>
      <text x="512" y="110">field / spatial</text>
      <text x="749" y="197">software / ownership</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="918.5" height="228.5" rx="18" fill="none" class="border" stroke-width="1.5"/>
</svg>
